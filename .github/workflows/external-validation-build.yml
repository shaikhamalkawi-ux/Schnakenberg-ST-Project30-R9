name: External-validation manuscript build

on:
  push:
    branches: [external-validation-gse152250]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-science poppler-utils python3-pip zip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Regenerate figures
        run: python make_figures.py

      - name: Compile manuscript
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Compile Supplementary Information
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error supplement.tex

      - name: Build named deliverables
        run: |
          cp main.pdf Manuscript_GSE152250_ExternalValidation.pdf
          cp supplement.pdf Supplementary_Material_GSE152250_ExternalValidation.pdf
          pdfunite Manuscript_GSE152250_ExternalValidation.pdf Supplementary_Material_GSE152250_ExternalValidation.pdf Manuscript_PLUS_Supplement_GSE152250_ExternalValidation.pdf

      - name: Preflight
        run: |
          set -e
          if grep -Eq "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations|multiply defined" main.log supplement.log; then
            echo "Undefined or multiply-defined LaTeX reference/citation detected" >&2
            grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations|multiply defined" main.log supplement.log || true
            exit 1
          fi

          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo
            echo "PDF metadata"
            for f in Manuscript_GSE152250_ExternalValidation.pdf Supplementary_Material_GSE152250_ExternalValidation.pdf Manuscript_PLUS_Supplement_GSE152250_ExternalValidation.pdf; do
              echo "--- $f"
              pdfinfo "$f" | grep -E 'Pages|Page size|Encrypted|PDF version'
            done
            echo
            echo "Type 3 font check"
            for f in Manuscript_GSE152250_ExternalValidation.pdf Supplementary_Material_GSE152250_ExternalValidation.pdf; do
              echo "--- $f"
              pdffonts "$f" | awk 'NR>2 && $2=="Type 3" {print}'
            done
            echo
            echo "SHA-256"
            sha256sum Manuscript_GSE152250_ExternalValidation.pdf Supplementary_Material_GSE152250_ExternalValidation.pdf Manuscript_PLUS_Supplement_GSE152250_ExternalValidation.pdf
            echo
            echo "Validation result"
            cat external_validation/results/GSE152250_external_validation_result.json
          } > ExternalValidation_Build_Verification.txt

          if pdffonts Manuscript_GSE152250_ExternalValidation.pdf Supplementary_Material_GSE152250_ExternalValidation.pdf 2>/dev/null | awk 'NR>2 && $2=="Type 3" {found=1} END{exit found?0:1}'; then
            echo "Type 3 font detected" >&2
            exit 1
          fi

      - name: Package source and validation
        run: |
          mkdir -p package
          cp main.tex supplement.tex make_figures.py requirements.txt BUILD.md README.md DATA_SOURCES.md REPRODUCIBILITY.md package/
          cp -r support package/
          cp -r external_validation package/
          cp -r figures package/
          cp Manuscript_GSE152250_ExternalValidation.pdf Supplementary_Material_GSE152250_ExternalValidation.pdf Manuscript_PLUS_Supplement_GSE152250_ExternalValidation.pdf package/
          cp ExternalValidation_Build_Verification.txt package/
          zip -qr Project30_GSE152250_ExternalValidation_Candidate.zip package

      - name: Upload review PDFs
        uses: actions/upload-artifact@v4
        with:
          name: gse152250-review-pdfs
          retention-days: 30
          if-no-files-found: error
          path: |
            Manuscript_GSE152250_ExternalValidation.pdf
            Supplementary_Material_GSE152250_ExternalValidation.pdf
            Manuscript_PLUS_Supplement_GSE152250_ExternalValidation.pdf
            ExternalValidation_Build_Verification.txt

      - name: Upload complete candidate package
        uses: actions/upload-artifact@v4
        with:
          name: gse152250-complete-candidate
          retention-days: 30
          if-no-files-found: error
          path: Project30_GSE152250_ExternalValidation_Candidate.zip
