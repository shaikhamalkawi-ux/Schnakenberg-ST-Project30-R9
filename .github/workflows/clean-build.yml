name: BioSystems ED3R1 clean source build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and PDF utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-science texlive-publishers poppler-utils python3-pip zip
      - name: Install reproducibility requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Regenerate figures and compile approved BioSystems source
        run: |
          python make_figures.py
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error supplement.tex
          pdfunite main.pdf supplement.pdf Manuscript_PLUS_Supplement.pdf
      - name: Fail-closed citation and PDF checks
        run: |
          set -eu
          if grep -Eq 'LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations|multiply defined' main.log supplement.log; then
            echo 'LaTeX citation or reference warning found' >&2
            exit 1
          fi
          for f in main.pdf supplement.pdf; do
            test -s "$f"
            pdfinfo "$f" | grep '^Pages:'
            if pdffonts "$f" | awk 'NR>2 && /Type 3/ {found=1} END {exit !found}'; then
              echo "Type 3 fonts in $f" >&2
              exit 1
            fi
          done
          sha256sum main.pdf supplement.pdf Manuscript_PLUS_Supplement.pdf > Build_SHA256SUMS.txt
          { echo 'BioSystems author-approved ED3R1 source build'; echo 'No portal submission or Zenodo DOI implied'; echo "Commit: $GITHUB_SHA"; pdfinfo main.pdf | grep '^Pages:'; pdfinfo supplement.pdf | grep '^Pages:'; cat Build_SHA256SUMS.txt; } > Build_Verification.txt
      - name: Upload named manuscript and Supplement PDFs
        uses: actions/upload-artifact@v4
        with:
          name: biosystems-ed3r1-pdfs
          retention-days: 30
          path: |
            main.pdf
            supplement.pdf
            Manuscript_PLUS_Supplement.pdf
            Build_SHA256SUMS.txt
            Build_Verification.txt
      - name: Upload compile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biosystems-ed3r1-compile-logs
          retention-days: 14
          path: |
            main.log
            supplement.log
