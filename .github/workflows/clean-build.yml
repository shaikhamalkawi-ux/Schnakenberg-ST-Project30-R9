name: Clean manuscript build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-science poppler-utils python3-pip zip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate figures
        run: python make_figures.py

      - name: Build main manuscript
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Build supplementary information
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error supplement.tex

      - name: Create named delivery files
        run: |
          cp main.pdf Manuscript.pdf
          cp supplement.pdf Supplementary_Material.pdf
          pdfunite Manuscript.pdf Supplementary_Material.pdf Manuscript_PLUS_Supplement.pdf

      - name: Verification report
        run: |
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo
            echo "SHA-256"
            sha256sum Manuscript.pdf Supplementary_Material.pdf Manuscript_PLUS_Supplement.pdf
            echo
            echo "PDF INFO"
            for f in Manuscript.pdf Supplementary_Material.pdf Manuscript_PLUS_Supplement.pdf; do
              echo "--- $f"
              pdfinfo "$f" | grep -E 'Pages|Page size|PDF version|Encrypted'
            done
            echo
            echo "TYPE 3 FONT CHECK"
            for f in Manuscript.pdf Supplementary_Material.pdf; do
              echo "--- $f"
              pdffonts "$f" | awk 'NR>2 && $2=="Type 3" {print}'
            done
            echo
            echo "LATEX WARNING CHECK"
            grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations|multiply defined" main.log supplement.log || true
          } > PreSubmission_Build_Verification.txt

          if grep -Eq "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations" main.log supplement.log; then
            echo "Undefined reference/citation detected" >&2
            exit 1
          fi

      - name: Package source snapshot
        run: |
          mkdir -p release_source
          cp main.tex supplement.tex make_figures.py requirements.txt BUILD.md README.md DATA_SOURCES.md REPRODUCIBILITY.md release_source/
          cp -r support release_source/
          cp -r external_validation release_source/
          cp -r figures release_source/
          zip -qr Overleaf_Source_and_Figures.zip release_source

      - name: Create audit closure note
        run: |
          cat > PreSubmission_Audit_Closure.md <<EOF
          # Pre-submission editorial closure

          Public repository: https://github.com/$GITHUB_REPOSITORY
          Clean-build commit: $GITHUB_SHA
          GitHub Actions run: $GITHUB_RUN_ID

          The clean build regenerated all publication figures from make_figures.py, compiled the main manuscript and Supplementary Information from source, created the combined review PDF, checked for undefined citations/references, checked Type 3 fonts, and recorded SHA-256 hashes and PDF metadata.

          Editorial items closed in the current public source:
          - Promot4 pre-submission audit applied to Main, Supplement, figures, references, metadata, and package consistency.
          - Title-page affiliations are wrapped within page bounds; author metadata are synchronized across Main and Supplement.
          - Abstract is concise while retaining the primary donor-paired result and independent GSE152250 external validation.
          - All analysis methods and statistical procedures are reported in the Main Methods; the Supplement contains extended results, provenance, traceability, and nomenclature rather than Supplementary Methods.
          - Statistics and reproducibility, Code availability, Data Availability, Ethics, AI-use disclosure, Acknowledgements/funding, Author contributions, and Competing interests are aligned to the current npj submission guidance.
          - Formal citations for all analyzed GEO/ArrayExpress/source datasets are included in the reference list.
          - All Main and Supplement tables/figures have prior text callouts, local notation is defined, and summary bar displays were replaced by point displays where appropriate.
          - GSE152250 independently reproduces the prespecified 24-h CTHRC1 direction in a separate human primary cardiac-fibroblast experiment; the 48-h direction remains positive and the 6-h contrast is near-null.
          - Repository wording matches the source-first contents actually present, and the repository remains public.

          Scientific claim boundaries remain bounded. GSE152250 is culture-level directional/time-course external validation, not donor-level evidence, and its FPKM-scale magnitude is not pooled with GSE97358. The repository does not claim independent re-extraction of the Saudi S1 target rows, a newly rerun donor-blocked negative-binomial coefficient, reconstruction of the unavailable four-family timing model, myocardial delay, physical cardiac diffusion coefficients, or a cardiac Turing/Hopf certificate.

          Submission note: the public GitHub URL identifies the repository owner. It is appropriate for identity-visible review. If a target journal mandates double-blind review, an anonymized submission copy would be required by journal policy.
          EOF

      - name: Create journal/review package
        run: |
          mkdir -p journal_review
          cp Manuscript.pdf Supplementary_Material.pdf Manuscript_PLUS_Supplement.pdf journal_review/
          cp Overleaf_Source_and_Figures.zip PreSubmission_Build_Verification.txt PreSubmission_Audit_Closure.md journal_review/
          zip -qr Journal_Review_Package.zip journal_review

      - name: Create new-chat transfer package
        run: |
          cat > NewChat_Transfer_Message.txt <<EOF
          # CONTINUE PROJECT 30 ALFIFIY — SCHNAKENBERG-ST MEDICAL

          START FROM THE CURRENT PUBLIC GITHUB AND CLEAN-BUILD CLOSURE. DO NOT RESTART.

          Active public repository:
          https://github.com/$GITHUB_REPOSITORY

          Clean-build commit:
          $GITHUB_SHA

          Manuscript title:
          "From Cardiac Omics to Identifiable Dynamics: Evidence Boundaries and Measurement Decisions for a Delayed Schnakenberg Model"

          Current clean build:
          - Main manuscript pages: $(pdfinfo Manuscript.pdf | awk '/^Pages:/ {print $2}')
          - Supplementary Information pages: $(pdfinfo Supplementary_Material.pdf | awk '/^Pages:/ {print $2}')
          - Combined review PDF pages: $(pdfinfo Manuscript_PLUS_Supplement.pdf | awk '/^Pages:/ {print $2}')
          - No Type 3 fonts in main/supplement
          - No undefined LaTeX citations or references in the clean build
          - All publication figures regenerated deterministically before compilation

          The latest pre-submission editorial closure already:
          - applied the full Promot4 audit and current npj-specific structure/declaration checks;
          - synchronized Ghassan Malkawi, Ahmed Elsayed, and Hassan Y. Alfifi across Main and Supplement;
          - moved all analysis methods/statistical procedures to the Main Methods and removed Supplementary Methods;
          - added formal dataset citations, Data Availability, Code availability, Ethics, AI-use disclosure, funding/acknowledgements, Author contributions, and Competing interests;
          - retained explicit callouts before every Main and Supplement table/figure;
          - added GSE152250 as an independently executed human primary cardiac-fibroblast external validation: 24-h CTHRC1 mean 108.605 versus 171.000 FPKM, log2 ratio +0.655, all three treated replicates above all three controls; 48 h remains positive and 6 h is near-null;
          - retained the public GitHub record and aligned repository/data-availability wording with actual contents.

          Preserve the scientific boundaries:
          - primary 84 donor-linked human cardiac-fibroblast paired result remains the primary empirical anchor;
          - GSE152250 is independent culture-level external direction/time-course replication and is not donor-level evidence or a pooled cross-study effect;
          - Saudi-center whole-LV evidence is contextual and not Saudi-population validation;
          - no independent re-extraction of the Saudi 2016 S1 target rows is claimed;
          - no newly rerun donor-blocked negative-binomial coefficient is claimed;
          - no reconstruction of the unavailable four-family timing-model specification is claimed;
          - no myocardial hard delay, physical cardiac diffusion coefficient, or cardiac Turing/Hopf certificate is claimed;
          - Schnakenberg remains a mechanistic stress test, not identified cardiac truth.

          Do not open a new scientific version merely for stylistic wording. Only change science for a verified error, new admitted evidence, author decision, or journal/reviewer request.
          EOF

          mkdir -p transfer
          cp NewChat_Transfer_Message.txt Manuscript.pdf Supplementary_Material.pdf Manuscript_PLUS_Supplement.pdf transfer/
          cp PreSubmission_Build_Verification.txt PreSubmission_Audit_Closure.md transfer/
          zip -qr NewChat_Transfer_COMPLETE.zip transfer

      - name: Upload main manuscript
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdf
          if-no-files-found: error
          retention-days: 30
          path: Manuscript.pdf

      - name: Upload supplementary material
        uses: actions/upload-artifact@v4
        with:
          name: supplementary-pdf
          if-no-files-found: error
          retention-days: 30
          path: Supplementary_Material.pdf

      - name: Upload combined review PDF
        uses: actions/upload-artifact@v4
        with:
          name: combined-pdf
          if-no-files-found: error
          retention-days: 30
          path: Manuscript_PLUS_Supplement.pdf

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: source-and-figures
          if-no-files-found: error
          retention-days: 30
          path: Overleaf_Source_and_Figures.zip

      - name: Upload journal review package
        uses: actions/upload-artifact@v4
        with:
          name: journal-review-package
          if-no-files-found: error
          retention-days: 30
          path: Journal_Review_Package.zip

      - name: Upload new-chat transfer
        uses: actions/upload-artifact@v4
        with:
          name: newchat-transfer
          if-no-files-found: error
          retention-days: 30
          path: NewChat_Transfer_COMPLETE.zip

      - name: Upload verification files
        uses: actions/upload-artifact@v4
        with:
          name: verification
          if-no-files-found: error
          retention-days: 30
          path: |
            PreSubmission_Build_Verification.txt
            PreSubmission_Audit_Closure.md
            main.log
            supplement.log
