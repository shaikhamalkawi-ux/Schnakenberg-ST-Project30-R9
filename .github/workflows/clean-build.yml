name: Clean manuscript build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-science poppler-utils python3-pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate figures
        run: python make_figures.py

      - name: Build main manuscript
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Build supplementary information
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error supplement.tex

      - name: Create combined review PDF
        run: pdfunite main.pdf supplement.pdf Manuscript_PLUS_Supplement.pdf

      - name: Verification report
        run: |
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo
            echo "SHA-256"
            sha256sum main.pdf supplement.pdf Manuscript_PLUS_Supplement.pdf
            echo
            echo "PDF INFO"
            for f in main.pdf supplement.pdf Manuscript_PLUS_Supplement.pdf; do
              echo "--- $f"
              pdfinfo "$f" | grep -E 'Pages|Page size|PDF version|Encrypted'
            done
            echo
            echo "TYPE 3 FONT CHECK"
            for f in main.pdf supplement.pdf; do
              echo "--- $f"
              pdffonts "$f" | awk 'NR>2 && $2=="Type 3" {print}'
            done
            echo
            echo "LATEX WARNING CHECK"
            grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations|multiply defined" main.log supplement.log || true
          } > BUILD_VERIFY.txt

          if grep -Eq "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations" main.log supplement.log; then
            echo "Undefined reference/citation detected" >&2
            exit 1
          fi

      - name: Package source snapshot
        run: |
          mkdir -p release_source
          cp main.tex supplement.tex make_figures.py requirements.txt BUILD.md README.md DATA_SOURCES.md REPRODUCIBILITY.md release_source/
          cp -r support release_source/
          cp -r figures release_source/
          zip -qr Source_and_Figures.zip release_source

      - name: Upload clean-build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: schnakenberg-clean-build
          if-no-files-found: error
          retention-days: 30
          path: |
            main.pdf
            supplement.pdf
            Manuscript_PLUS_Supplement.pdf
            Source_and_Figures.zip
            BUILD_VERIFY.txt
            main.log
            supplement.log
