name: GSE97358 paired-NB source profile
on:
  push:
    branches:
      - analysis/gse97358-donor-nb-r1
    paths:
      - '.github/workflows/gse97358-paired-nb.yml'
      - 'analysis/gse97358_paired_nb/**'
permissions:
  contents: read
jobs:
  source-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect original source layout
        run: python analysis/gse97358_paired_nb/inspect.py
      - name: Upload ONLY data layout and source hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gse97358-source-profile
          path: analysis/gse97358_paired_nb/results/
          if-no-files-found: warn
          retention-days: 15
